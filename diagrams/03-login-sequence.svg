<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Login and API call sequence through the BFF</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="590" fill="#FFFFFF"/>
<rect x="45" y="30" width="110" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="100.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Browser</text>
<line x1="100" y1="70" x2="100" y2="570" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 4"/>
<rect x="205" y="30" width="110" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="260.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">BFF</text>
<line x1="260" y1="70" x2="260" y2="570" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 4"/>
<rect x="365" y="30" width="110" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="420.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Okta</text>
<line x1="420" y1="70" x2="420" y2="570" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 4"/>
<rect x="515" y="30" width="110" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="570.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Product API</text>
<line x1="570" y1="70" x2="570" y2="570" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 4"/>
<text x="180" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">GET /bff/login</text>
<line x1="100" y1="110" x2="258" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="180" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">302 to Okta + PKCE</text>
<line x1="260" y1="150" x2="102" y2="150" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Sign in, MFA</text>
<line x1="100" y1="190" x2="418" y2="190" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">302 with code</text>
<line x1="420" y1="230" x2="102" y2="230" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="180" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">GET /callback?code</text>
<line x1="100" y1="270" x2="258" y2="270" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Code + PKCE verifier</text>
<line x1="260" y1="310" x2="418" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">ID, access, refresh</text>
<line x1="420" y1="350" x2="262" y2="350" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="180" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Set-Cookie: session</text>
<line x1="260" y1="390" x2="102" y2="390" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="180" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">GET /api/a + cookie</text>
<line x1="100" y1="450" x2="258" y2="450" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="495" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Bearer access token</text>
<line x1="260" y1="490" x2="568" y2="490" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="495" y="518" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">200 or 403</text>
<line x1="570" y1="530" x2="262" y2="530" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="180" y="548" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">JSON response</text>
<line x1="260" y1="560" x2="102" y2="560" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
