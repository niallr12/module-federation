<svg xmlns="http://www.w3.org/2000/svg" width="680" height="436" viewBox="0 0 680 436" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Decision tree for frontend composition</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="436" fill="#FFFFFF"/>
<rect x="210" y="30" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Independent deploys needed?</text>
<text x="340.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Confirm, don't assume</text>
<path d="M210 58 L140 58 L140 138" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="148" y="104" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">No</text>
<path d="M470 58 L510 58 L510 138" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="518" y="104" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text>
<rect x="40" y="140" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="140.0" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">One app, one repo</text>
<text x="140.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Simplest, lowest cost</text>
<rect x="380" y="140" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="510.0" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Interleaved on one screen?</text>
<text x="510.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Shared context, one view</text>
<path d="M480 196 L480 222 L300 222 L300 248" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="390" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">No</text>
<line x1="560" y1="196" x2="560" y2="248" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="568" y="222" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text>
<rect x="200" y="250" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="300.0" y="268.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Path-based apps</text>
<text x="300.0" y="288.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">One domain, page loads</text>
<rect x="440" y="250" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="540.0" y="268.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Shell + MFEs</text>
<text x="540.0" y="288.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">MF or web components</text>
<rect x="40" y="340" width="600" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340.0" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Always: one origin, one BFF, no iframes</text>
<text x="340.0" y="378.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Repo: shared standards → monorepo, hard boundaries → multi-repo</text>
</svg>
