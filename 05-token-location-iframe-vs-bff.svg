<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Where does the token live: iframe vs BFF</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="440" fill="#FFFFFF"/>
<rect x="40" y="30" width="290" height="380" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="185" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Iframe + postMessage</text>
<text x="185" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Token in browser JavaScript</text>
<rect x="350" y="30" width="290" height="380" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="495" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">BFF</text>
<text x="495" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Token never reaches the browser</text>
<rect x="60" y="92" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="185.0" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Shell, origin 1</text>
<text x="185.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">JWT in JS memory</text>
<line x1="185" y1="148" x2="185" y2="178" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="195" y="163" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">postMessage(JWT)</text>
<rect x="60" y="180" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="185.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Iframe, origin 2</text>
<text x="185.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">JWT in JS memory</text>
<line x1="185" y1="236" x2="185" y2="266" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="195" y="251" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Bearer JWT, CORS</text>
<rect x="60" y="268" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="286.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Product B API</text>
<text x="185.0" y="306.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Broad token scope</text>
<text x="185" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Readable by XSS in two origins</text>
<text x="185" y="374" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Third-party cookies blocked</text>
<rect x="370" y="92" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="495.0" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Shell + MFEs, one origin</text>
<text x="495.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">HttpOnly cookie only</text>
<line x1="495" y1="148" x2="495" y2="178" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="505" y="163" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Cookie, no token</text>
<rect x="370" y="180" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="495.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">BFF</text>
<text x="495.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Tokens stored server-side</text>
<line x1="495" y1="236" x2="495" y2="266" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="505" y="251" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Bearer, server-side</text>
<rect x="370" y="268" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="495.0" y="286.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Product APIs</text>
<text x="495.0" y="306.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Scope + group checked</text>
<text x="495" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">XSS cannot read a token</text>
<text x="495" y="374" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Same origin, no CORS</text>
</svg>
