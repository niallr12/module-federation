<text x="185.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">apps/bff</text>
<rect x="60" y="260" width="250" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="185.0" y="276.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">libs/design-system</text>
<rect x="60" y="302" width="250" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="185.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">libs/contracts</text>
<rect x="350" y="30" width="290" height="320" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="495" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Multi-repo</text>
<text x="495" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Versioned packages, coordinated upgrades</text>
<rect x="370" y="92" width="250" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="495.0" y="108.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">shell repo</text>
<rect x="370" y="134" width="250" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="495.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">product-a repo</text>
<rect x="370" y="176" width="250" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="495.0" y="192.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">product-b repo</text>
<rect x="370" y="218" width="250" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
