<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Monorepo versus multi-repo layout</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="390" fill="#FFFFFF"/>
<rect x="40" y="30" width="290" height="320" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="185" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">One repo (Nx monorepo)</text>
<text x="185" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">One PR, atomic changes</text>
<rect x="60" y="92" width="250" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="185.0" y="108.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">apps/shell</text>
