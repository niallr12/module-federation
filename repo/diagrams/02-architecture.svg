<text x="456" y="342" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">How it works</text>
<text x="456" y="370" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">1  OIDC login at BFF</text>
<text x="456" y="394" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">2  Tokens kept server-side</text>
<text x="456" y="418" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">3  One token, one aud</text>
<text x="456" y="442" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">4  BFF gates by group</text>
<text x="456" y="466" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">5  API: scope + group</text>
</svg>
