<text x="340.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Shell app</text>
<text x="340.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Nav, layout, routing, design system</text>
<rect x="70" y="136" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="150.0" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Product A</text>
<rect x="260" y="136" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340.0" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Product B</text>
<rect x="450" y="136" width="160" height="44" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="530" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Future product</text>
<line x1="210" y1="196" x2="210" y2="236" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="222" y="216" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">HttpOnly session cookie only</text>
<rect x="40" y="238" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="210.0" y="256.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">BFF, same origin</text>
<text x="210.0" y="276.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Session, group gate, refresh</text>
<line x1="382" y1="266" x2="438" y2="266" stroke="#5F5E5A" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="440" y="238" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="540.0" y="256.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Okta</text>
<text x="540.0" y="276.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">One app, one auth server</text>
<line x1="120" y1="294" x2="120" y2="348" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<line x1="300" y1="294" x2="300" y2="348" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="40" y="350" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="120.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Product A API</text>
<text x="120.0" y="388.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Needs product-a.read</text>
<rect x="220" y="350" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="300.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Product B API</text>
<text x="300.0" y="388.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Needs product-b.read</text>
