<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Target architecture: shell, micro-frontends, BFF, Okta, product APIs</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#FFFFFF"/>
<rect x="40" y="30" width="600" height="166" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="60" y="46" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Browser, single origin</text>
